<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EndpointTrust Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#1d4ed8);display:flex;align-items:center;justify-content:center;font-family:Inter,Arial,sans-serif}.card{width:420px;border:0;border-radius:22px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.brand{font-weight:800;color:#0f3c81}.small-muted{color:#64748b;font-size:14px}</style>
</head>
<body>
  <div class="card p-4">
    <h3 class="brand mb-1">EndpointTrust PKI</h3>
    <p class="small-muted mb-4">Administrator dashboard access</p>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post" action="{{ PUBLIC_PREFIX }}/login">
      <label class="form-label">Admin username</label>
      <input class="form-control mb-3" name="username" value="admin" autocomplete="username">
      <label class="form-label">Admin password</label>
      <input class="form-control mb-3" name="password" type="password" placeholder="EndpointTrust@123" autocomplete="current-password">
      <button class="btn btn-primary w-100">Login to dashboard</button>
    </form>
    <p class="small-muted mt-3 mb-0">Device registration is restricted to the IT administrator. Unverified users cannot register laptops from the access-denied page.</p>
  </div>
</body>
</html>

server {
    listen 80;
    server_name localhost;

    location = / {
        return 302 /endpointtrust/device-portal;
    }

    # EndpointTrust web application and administration APIs.
    location /endpointtrust/ {
        proxy_pass http://endpointtrust:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser device APIs. All requests remain same-origin so the verified
    # device cookie returned by /api/auth/verify is stored by the browser.
    location /api/ {
        proxy_pass http://endpointtrust:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compatibility route for an existing session URL.
    location /auth/ {
        proxy_pass http://endpointtrust:5000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal auth subrequest used before every protected HR request.
    location = /_endpointtrust_auth {
        internal;
        proxy_pass http://endpointtrust:5000/auth/nginx-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Protected HR application. The request is proxied only after the current
    # browser cookie maps to an active, non-expired, non-revoked device session.
    location /internal/ {
        auth_request /_endpointtrust_auth;
        auth_request_set $endpoint_device $upstream_http_x_endpointtrust_device;
        auth_request_set $endpoint_cert $upstream_http_x_endpointtrust_cert;
        auth_request_set $endpoint_verified $upstream_http_x_endpointtrust_verified;

        proxy_set_header X-EndpointTrust-Device $endpoint_device;
        proxy_set_header X-EndpointTrust-Cert $endpoint_cert;
        proxy_set_header X-EndpointTrust-Verified $endpoint_verified;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://internal_hr:5001/;
    }

    error_page 401 403 = @access_denied;
    location @access_denied {
        default_type text/html;
        return 403 '<!doctype html><html><head><meta charset="utf-8"><title>EndpointTrust Access Denied</title><style>body{font-family:Arial;background:#f6f8fb;display:flex;height:100vh;align-items:center;justify-content:center;margin:0}.card{background:white;border:1px solid #dfe7f3;border-radius:18px;padding:36px;max-width:590px;box-shadow:0 18px 55px rgba(15,23,42,.12)}h1{color:#dc2626;margin:0 0 10px}.btn{display:inline-block;margin-top:18px;background:#1d4ed8;color:white;text-decoration:none;padding:12px 18px;border-radius:10px}.muted{color:#64748b}</style></head><body><div class="card"><h1>Access denied by EndpointTrust PKI</h1><p>This browser does not currently have an active trusted-device session.</p><p class="muted">An issued certificate alone is not enough. Open the Device Portal, fetch the approved certificate, and complete <b>Prove key ownership &amp; connect</b>. Revoked or expired certificates remain blocked.</p><a class="btn" href="/endpointtrust/device-portal">Open Device Portal</a></div></body></html>';
    }
}

services:
  nginx_gateway:
    image: nginx:1.27-alpine
    container_name: endpointtrust_nginx_gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - endpointtrust
      - internal_hr
    networks:
      - public_net
      - private_net

  endpointtrust:
    build: ./endpointtrust
    container_name: endpointtrust_server
    environment:
      - FLASK_ENV=production
      - ENDPOINTTRUST_DB=/app/data/endpointtrust.db
      - ENDPOINTTRUST_CERT_DIR=/app/certs
      - ENDPOINTTRUST_REBIND_IP=false
    volumes:
      - endpointtrust_data:/app/data
      - endpointtrust_certs:/app/certs
    expose:
      - "5000"
    networks:
      - private_net

  internal_hr:
    build: ./internal_hr
    container_name: endpointtrust_internal_hr
    expose:
      - "5001"
    networks:
      - private_net

volumes:
  endpointtrust_data:
  endpointtrust_certs:

networks:
  public_net:
  private_net:
    internal: true
